<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Student debate</title>
  <desc id="d">Two students stand at podiums on opposite sides of a classroom stage, debating whether schools should ban phones during class, while classmates watch.</desc>
  <!-- wall and floor -->
  <rect width="960" height="480" fill="#e8eef5"/>
  <rect y="330" width="960" height="150" fill="#c9a77c"/>
  <rect y="322" width="960" height="10" fill="#8a6a45"/>
  <!-- board -->
  <rect x="250" y="40" width="460" height="130" rx="10" fill="#23513f"/>
  <rect x="250" y="40" width="460" height="130" rx="10" fill="none" stroke="#8a6a45" stroke-width="8"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#f4f1e8">
    <text x="480" y="82" font-size="20" letter-spacing="2">RESOLUTION</text>
    <text x="480" y="118" font-size="24" font-weight="700">Schools should ban phones</text>
    <text x="480" y="150" font-size="24" font-weight="700">during class time.</text>
  </g>
  <!-- timer -->
  <rect x="770" y="60" width="130" height="70" rx="10" fill="#1c1c1c"/>
  <text x="835" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="700" fill="#ff6b5b">3:00</text>
  <!-- AFF speaker (left) -->
  <circle cx="190" cy="185" r="34" fill="#8d5524"/>
  <path d="M156 178 q34 -44 68 0 q-4 -30 -34 -32 q-30 2 -34 32z" fill="#1c1c1c"/>
  <rect x="148" y="222" width="84" height="110" rx="26" fill="#0b4f8a"/>
  <rect x="226" y="236" width="60" height="16" rx="8" fill="#0b4f8a" transform="rotate(-28 226 244)"/>
  <circle cx="284" cy="214" r="10" fill="#8d5524"/>
  <!-- AFF podium -->
  <path d="M120 270 h140 l-14 110 h-112z" fill="#6b4a2b"/>
  <rect x="112" y="262" width="156" height="16" rx="4" fill="#8a6a45"/>
  <text x="190" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f4f1e8">FOR</text>
  <!-- AFF bubble -->
  <rect x="40" y="60" width="180" height="70" rx="16" fill="#ffffff" stroke="#0b4f8a" stroke-width="3"/>
  <path d="M150 128 l18 26 l4 -26z" fill="#ffffff" stroke="#0b4f8a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="148" y="125" width="26" height="6" fill="#ffffff"/>
  <text x="130" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0b4f8a">My first point</text>
  <text x="130" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#1c1c1c">is focus…</text>
  <!-- NEG speaker (right) -->
  <circle cx="770" cy="190" r="34" fill="#f1c27d"/>
  <path d="M734 190 q2 -52 36 -54 q34 2 36 54 q-8 -30 -36 -34 q-28 4 -36 34z" fill="#b5651d"/>
  <rect x="728" y="227" width="84" height="105" rx="26" fill="#8a3b0b"/>
  <rect x="680" y="248" width="56" height="16" rx="8" fill="#8a3b0b" transform="rotate(20 736 256)"/>
  <circle cx="684" cy="266" r="10" fill="#f1c27d"/>
  <!-- NEG podium -->
  <path d="M700 270 h140 l-14 110 h-112z" fill="#6b4a2b"/>
  <rect x="692" y="262" width="156" height="16" rx="4" fill="#8a6a45"/>
  <text x="770" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f4f1e8">AGAINST</text>
  <!-- audience (backs of heads) -->
  <g>
    <circle cx="110" cy="440" r="38" fill="#3b2a1a"/><rect x="62" y="460" width="96" height="40" rx="20" fill="#4b6584"/>
    <circle cx="260" cy="452" r="36" fill="#1c1c1c"/><rect x="214" y="468" width="92" height="30" rx="20" fill="#20bf6b" opacity=".85"/>
    <circle cx="410" cy="438" r="40" fill="#a0522d"/><rect x="360" y="462" width="100" height="40" rx="20" fill="#eb8a3a"/>
    <circle cx="560" cy="450" r="36" fill="#d9b382"/><rect x="514" y="468" width="92" height="30" rx="20" fill="#6c5ce7"/>
    <circle cx="710" cy="440" r="38" fill="#2d1b0e"/><rect x="662" y="460" width="96" height="40" rx="20" fill="#e84393"/>
    <circle cx="860" cy="452" r="36" fill="#5c3a21"/><rect x="814" y="468" width="92" height="30" rx="20" fill="#0fb9b1"/>
  </g>
  <!-- NEG bubble -->
  <rect x="540" y="186" width="160" height="70" rx="16" fill="#ffffff" stroke="#8a3b0b" stroke-width="3"/>
  <path d="M698 206 l30 -8 l-30 24z" fill="#ffffff" stroke="#8a3b0b" stroke-width="3" stroke-linejoin="round"/>
  <rect x="694" y="204" width="7" height="20" fill="#ffffff"/>
  <text x="620" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#8a3b0b">But what about</text>
  <text x="620" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#1c1c1c">emergencies?</text>
</svg>
