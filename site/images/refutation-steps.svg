<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d">
  <title id="t">Four-step refutation</title>
  <desc id="d">Four steps in a row: 1 They say, 2 But, 3 Because, 4 Therefore.</desc>
  <rect width="720" height="200" fill="#fffdf8"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="15" y="40" width="155" height="120" rx="14" fill="#0b4f8a"/>
    <text x="92" y="90" font-size="22" font-weight="700" fill="#fff">1. They say</text>
    <text x="92" y="118" font-size="15" fill="#fff">Restate their point</text>
    <rect x="195" y="40" width="155" height="120" rx="14" fill="#8a3b0b"/>
    <text x="272" y="90" font-size="22" font-weight="700" fill="#fff">2. But</text>
    <text x="272" y="118" font-size="15" fill="#fff">Say why it's wrong</text>
    <rect x="375" y="40" width="155" height="120" rx="14" fill="#1f6b3a"/>
    <text x="452" y="90" font-size="22" font-weight="700" fill="#fff">3. Because</text>
    <text x="452" y="118" font-size="15" fill="#fff">Give your proof</text>
    <rect x="555" y="40" width="155" height="120" rx="14" fill="#4b2a7a"/>
    <text x="632" y="90" font-size="22" font-weight="700" fill="#fff">4. Therefore</text>
    <text x="632" y="118" font-size="15" fill="#fff">Why you win it</text>
  </g>
</svg>
