<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Claim, Evidence, Reasoning</title>
  <desc id="d">The claim sits on top. Evidence sits at the bottom. Reasoning is the bridge that connects the evidence to the claim.</desc>
  <rect width="720" height="320" fill="#fffdf8"/>
  <rect x="210" y="20" width="300" height="70" rx="14" fill="#0b4f8a"/>
  <text x="360" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">CLAIM</text>
  <text x="360" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#fff">What I believe</text>
  <rect x="210" y="125" width="300" height="70" rx="14" fill="#8a3b0b"/>
  <text x="360" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">REASONING</text>
  <text x="360" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#fff">Why the evidence proves it</text>
  <rect x="210" y="230" width="300" height="70" rx="14" fill="#1f6b3a"/>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">EVIDENCE</text>
  <text x="360" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#fff">Facts, data, expert quotes</text>
  <path d="M360 228 V199" stroke="#1c1c1c" stroke-width="4" marker-end="url(#a)"/>
  <path d="M360 123 V94" stroke="#1c1c1c" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1c1c"/></marker></defs>
  <text x="40" y="170" font-family="system-ui, sans-serif" font-size="16" fill="#1c1c1c">Build from the</text>
  <text x="40" y="192" font-family="system-ui, sans-serif" font-size="16" fill="#1c1c1c">bottom up ↑</text>
</svg>
